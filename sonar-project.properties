# Primary Meta Information
sonar.projectKey=banking-playwright-automation
sonar.projectName=Digital Banking Playwright Automation Framework
sonar.projectVersion=1.0

# Targeting Execution Sources
sonar.sources=src/
sonar.tests=tests/
sonar.sourceEncoding=UTF-8
sonar.language=ts

# TypeScript Infrastructure Mapping
# This forces the Sonar scanner to read the type parameters of your suite
sonar.typescript.tsconfigPath=./tsconfig.json

# Performance & Exclusion Controls
# Prevents large automation trace files from saturating the Sonar server
sonar.exclusions=node_modules/**/*, test-results/**/*, playwright-report/**/*, all-blobs/**/*, blob-report/**/*
sonar.coverage.exclusions=**/*.ts, **/*.spec.ts, **/*.config.ts

# Integration with Local Linter Controls
# This passes your ESLint issues straight into the SonarQube dashboard
sonar.eslint.eslintconfigpath=eslint.config.js